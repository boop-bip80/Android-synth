name: Diagnostic - inspect failing compact oscillator runtime
on:
  push:
    branches: [diagnostic/isolated-compact-osc-20261103]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    name: Read exact fresh-emulator failure diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact failed single-test emulator diagnostics
        uses: actions/download-artifact@v4
        with:
          name: isolated-compact-oscillator-api35
          run-id: 41628143712
          github-token: ${{ github.token }}
          path: diagnostic
      - name: Print bounded instrumentation, logcat and device/memory postmortem
        shell: bash
        run: |
          find diagnostic -maxdepth 3 -type f -printf '%p %s bytes\n'
          for f in diagnostic/*.txt diagnostic/**/*.txt; do
            [[ -f "$f" ]] || continue
            printf '\n=== DIAGNOSTIC %s ===\n' "$f"
            case "$f" in
              *logcat*) tail -n 180 "$f" | cut -c 1-280 ;;
              *) sed -n '1,160p' "$f" | cut -c 1-280 ;;
            esac
          done
