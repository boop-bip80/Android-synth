name: Diagnostic - cold strict #149 reordered compact editor
on:
  push:
    branches: [diagnostic/isolated-compact-osc-20261103]
permissions:
  contents: read
  actions: read
jobs:
  isolated:
    name: Fresh emulator original strict 350dp toggle test after production reorder
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install API 35 SDK before emulator allocation
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download validated #149 EXACT app artifact (no build during QEMU)
        uses: actions/download-artifact@v4
        with:
          name: orbital-debug-apk
          run-id: 41630528857
          github-token: ${{ github.token }}
          path: app/build/outputs/apk/debug
      - name: Download validated #149 EXACT androidTest artifact
        uses: actions/download-artifact@v4
        with:
          name: orbital-debug-android-test-apk
          run-id: 41630528857
          github-token: ${{ github.token }}
          path: app/build/outputs/apk/androidTest/debug
      - name: Enable /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run isolated real 360x350 Compose test on clean emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: bash .github/workflows/diagnostic-compact-osc.sh
      - name: Retain bounded exact provenance/phase, output and pre-crash Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-compact-oscillator-api35
          path: |
            artifacts/isolated-compact-*.txt
            artifacts/isolated-compact-*.png
          if-no-files-found: warn
          retention-days: 7
