name: Diagnostic - inspect genuine compact350 test failure
on:
  push:
    branches: [diagnostic/isolated-compact-osc-20261103]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    name: Inspect exact compact350 JUnit XML and live test phases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download exact compact350 continuous Android precrash logs
        uses: actions/download-artifact@v4
        with:
          name: orbital-api35-compact350-emulator-diagnostics
          run-id: 41633233561
          github-token: ${{ github.token }}
          path: diagnostics
      - name: Download exact real API35 compact350 JUnit XML
        uses: actions/download-artifact@v4
        with:
          name: orbital-compact350-android-test-results
          run-id: 41633233561
          github-token: ${{ github.token }}
          path: results
      - name: Print bounded exact test phases and assertion stack
        shell: bash
        run: |
          find diagnostics results -type f -printf '%p %s bytes\n' | head -n 70
          printf '\n=== LAST COMPACT350 PHASE EVENTS ===\n'
          find diagnostics -type f -name '*live-logcat*' -print0 | while IFS= read -r -d '' file; do
            grep -E 'OrbitalCompact350|FATAL EXCEPTION|OutOfMemoryError|native crash|SIGSEGV' "$file" | tail -n 140 | cut -c 1-350 || true
          done
          printf '\n=== JUNIT COMPACT350 FAILURE XML ===\n'
          find results -type f -name '*.xml' -print0 | while IFS= read -r -d '' file; do
            printf 'XML file %s\n' "$file"
            python3 -c 'import sys,xml.etree.ElementTree as E; d=E.parse(sys.argv[1]); print([(c.attrib, [(n.tag, n.attrib, (n.text or "")[:4000]) for n in c if n.tag in ("failure","error","skipped")]) for c in d.findall(".//testcase")])' "$file"
          done
          printf '\n=== HOST MEMORY BEFORE NATIVE EMULATOR EXIT ===\n'
          find diagnostics -type f -name '*host-memory*' -print0 | while IFS= read -r -d '' file; do
            tail -n 65 "$file" | cut -c 1-240
          done
          printf '\n=== PER-TEST LOGCAT AND UTP PHASES ===\n'
          find results -type f -name 'utp.0.log' -print0 | while IFS= read -r -d '' file; do
            printf 'UTP %s\n' "$file"
            tail -n 135 "$file" | cut -c 1-320
          done
          find results -type f -name 'logcat-*' -print0 | while IFS= read -r -d '' file; do
            printf 'LOGCAT %s\n' "$file"
            grep -En 'OrbitalCompact350|AndroidRuntime|ANR|OutOfMemoryError|FATAL EXCEPTION|SIGSEGV|fatal|TEST|Crash|crash' "$file" | tail -n 125 | cut -c 1-320 || true
            printf 'END LOGCAT 50:\n'
            tail -n 50 "$file" | cut -c 1-320
          done
