name: Diagnostic only - ORBITAL ANR with emulator audio ON
on:
  push:
    branches:
      - diag/visuals-orbital-anr-audio-on-20261103
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  visual_anr_reproduction:
    name: Exact APK cold relaunch and main-thread ANR traces
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORBITAL_TEST_SUITE: visuals
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install API35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download exact host debug APK
        uses: actions/download-artifact@v4
        with:
          name: orbital-debug-apk
          run-id: 41633233561
          github-token: ${{ github.token }}
          path: app/build/outputs/apk/debug
      - name: Download exact host instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: orbital-debug-android-test-apk
          run-id: 41633233561
          github-token: ${{ github.token }}
          path: app/build/outputs/apk/androidTest/debug
      - name: Validate diagnostic script syntax
        run: bash -n .github/workflows/ci-diagnostic-visuals-anr.sh && bash -n .github/workflows/ci-stage-bootstrap.sh && bash -n .github/workflows/ci-immersive-stage.sh
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Reproduce original strict stage-to-immersive transition
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -no-boot-anim
          script: bash .github/workflows/ci-diagnostic-visuals-anr.sh
      - name: Upload ANR traces and exact strict GUI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-strict-visual-anr-diagnostic
          path: |
            artifacts/diag-*
            artifacts/focus-bootstrap-*
            artifacts/immersive-*
            artifacts/orbital-emulator.png
            artifacts/orbital-immersive-emulator.png
          if-no-files-found: warn
          retention-days: 14
