name: Diagnostic - original reference SOUND hero screenshot (standalone)

on:
  push:
    branches:
      - feature/reference-sound-hero-20261103

permissions:
  contents: read

concurrency:
  group: reference-sound-hero-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genuine-hero-frame:
    name: Real API35 AGSL plasma/XY/knob hero pixel proof
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install pinned Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build real app/instrumentation APKs before starting QEMU
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          mkdir -p artifacts/hero-debug-apk artifacts/hero-debug-test-apk
          cp app/build/outputs/apk/debug/*.apk artifacts/hero-debug-apk/
          cp app/build/outputs/apk/androidTest/debug/*.apk artifacts/hero-debug-test-apk/
          test -n "$(find artifacts/hero-debug-apk -name '*.apk' -print -quit)"
          test -n "$(find artifacts/hero-debug-test-apk -name '*.apk' -print -quit)"
      - name: Enable hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Instrument real Android UI and extract genuine hero framebuffer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: bash .github/workflows/ci-reference-hero-preview.sh
      - name: Upload real 1080x2400 standalone reference hero pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-original-reference-hero-standalone-api35
          path: |
            artifacts/reference-sound-hero-standalone.png
            artifacts/reference-hero-provenance.txt
            artifacts/reference-hero-instrumentation.txt
            artifacts/reference-hero-install.txt
            artifacts/reference-hero-test-install.txt
          if-no-files-found: warn
          retention-days: 14
