name: Diagnostic - original Orbital UI reference preview

on:
  push:
    branches:
      - diagnostic/reference-preview-20261103
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preview:
    name: Render source reference PNG to auditable compact JPEG
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Resize actual repository PNG and stream proof pixels as UTF-8
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import os
          from PIL import Image, ImageOps

          path = "design/orbital-ui-reference.png"
          assert os.path.isfile(path), "Original generated reference is missing"
          with open(path, "rb") as source:
              blob = source.read()
          assert blob[:8] == b"\x89PNG\r\n\x1a\n", "Original reference is not a PNG"
          image = Image.open(io.BytesIO(blob))
          source_dimensions = image.size
          image = ImageOps.exif_transpose(image).convert("RGB")
          image.thumbnail((700, 1400), Image.Resampling.LANCZOS)
          stream = io.BytesIO()
          image.save(stream, format="JPEG", quality=47, optimize=True, progressive=True)
          jpeg = stream.getvalue()
          assert jpeg[:3] == b"\xff\xd8\xff"
          assert len(jpeg) > 4096, "Preview unexpectedly small"
          os.makedirs("artifacts", exist_ok=True)
          with open("artifacts/orbital-reference-preview.jpg", "wb") as output:
              output.write(jpeg)
          encoded = base64.b64encode(jpeg).decode("ascii")
          print(
              f"REFERENCE_JPEG_BEGIN source_dimensions={source_dimensions} "
              f"preview_dimensions={image.size} original_sha256={hashlib.sha256(blob).hexdigest()} "
              f"jpeg_sha256={hashlib.sha256(jpeg).hexdigest()} "
              f"jpeg_bytes={len(jpeg)} base64_characters={len(encoded)}"
          )
          for offset in range(0, len(encoded), 512):
              print(f"REFERENCE_B64_{offset//512:04d}:{encoded[offset:offset + 512]}")
          print("REFERENCE_JPEG_END")
          PY
      - name: Keep the same actual resized reference as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-original-ui-reference-preview
          path: artifacts/orbital-reference-preview.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Download actual successful MAIN emulator framebuffer artifacts (read only)
        uses: actions/download-artifact@v4
        with:
          name: orbital-api35-general-emulator-screenshot
          run-id: 41593445962
          github-token: ${{ github.token }}
          path: artifacts/real-emulator-main
      - name: Convert genuine successful emulator captures to JPEG for visual parity audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import os
          from PIL import Image, ImageOps

          captures = [
              ("ACTUAL", "orbital-emulator.png"),
              ("OSC", "orbital-oscillator-workbench.png"),
          ]
          for label, filename in captures:
              path = os.path.join("artifacts", "real-emulator-main", filename)
              if not os.path.isfile(path):
                  print(f"{label}_MISSING: {filename} unavailable in successful main artifact")
                  continue
              with open(path, "rb") as stream:
                  blob = stream.read()
              assert blob[:8] == b"\x89PNG\r\n\x1a\n", f"{filename} not valid PNG"
              image = Image.open(io.BytesIO(blob))
              source_dimensions = image.size
              image = ImageOps.exif_transpose(image).convert("RGB")
              image.thumbnail((700, 1400), Image.Resampling.LANCZOS)
              encoded_file = io.BytesIO()
              image.save(encoded_file, format="JPEG", quality=47,
                         optimize=True, progressive=True)
              jpeg = encoded_file.getvalue()
              assert len(jpeg) > 4096, f"{filename} preview empty"
              encoded = base64.b64encode(jpeg).decode("ascii")
              print(
                  f"{label}_JPEG_BEGIN file={filename} source_dimensions={source_dimensions} "
                  f"preview_dimensions={image.size} original_sha256={hashlib.sha256(blob).hexdigest()} "
                  f"jpeg_sha256={hashlib.sha256(jpeg).hexdigest()} "
                  f"jpeg_bytes={len(jpeg)} base64_characters={len(encoded)}"
              )
              for offset in range(0, len(encoded), 512):
                  print(f"{label}_B64_{offset // 512:04d}:{encoded[offset:offset+512]}")
              print(f"{label}_JPEG_END")
          PY

      - name: Download real held-note immersive stage screenshot from #120 successful API35 run (read only)
        uses: actions/download-artifact@v4
        with:
          name: orbital-api35-stage-emulator-screenshot
          run-id: 41600952276
          github-token: ${{ github.token }}
          path: artifacts/real-stage-success
      - name: Stream resized genuine stage frame pixels for visual quality audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import glob
          import hashlib
          import io
          import os
          from PIL import Image, ImageOps

          files = sorted(glob.glob('artifacts/real-stage-success/**/*.png', recursive=True))
          assert files, 'Expected real API35 stage PNG artifact; no image found'
          for index, path in enumerate(files):
              with open(path, 'rb') as stream:
                  blob = stream.read()
              assert blob[:8] == b'\x89PNG\r\n\x1a\n', 'Screenshot has bad PNG signature'
              original = Image.open(io.BytesIO(blob))
              size = original.size
              image = ImageOps.exif_transpose(original).convert('RGB')
              image.thumbnail((700, 1400), Image.Resampling.LANCZOS)
              out = io.BytesIO()
              image.save(out, format='JPEG', quality=52, optimize=True, progressive=True)
              jpeg = out.getvalue()
              assert len(jpeg) > 4000, 'Stage image unexpectedly tiny'
              prefix = f'STAGE{index}'
              encoded = base64.b64encode(jpeg).decode('ascii')
              print(f'{prefix}_JPEG_BEGIN file={os.path.basename(path)} original={size} preview={image.size} sha256={hashlib.sha256(blob).hexdigest()} bytes={len(jpeg)}')
              for offset in range(0, len(encoded), 512):
                  print(f'{prefix}_B64_{offset // 512:04d}:{encoded[offset:offset+512]}')
              print(f'{prefix}_JPEG_END')
          PY

      - name: Download genuine #149 latest hosted MainActivity SOUND framebuffer (read only)
        uses: actions/download-artifact@v4
        with:
          name: orbital-api35-visuals-emulator-screenshot
          run-id: 41618045253
          github-token: ${{ github.token }}
          path: artifacts/live-sound-host-normal
      - name: Download genuine #149 compact 360dp hosted SOUND framebuffer (read only)
        uses: actions/download-artifact@v4
        with:
          name: orbital-api35-compact-emulator-screenshot
          run-id: 41618045253
          github-token: ${{ github.token }}
          path: artifacts/live-sound-host-compact
      - name: Expose bounded real-host SOUND JPEGs for original artwork parity inspection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import glob
          import hashlib
          import io
          import os
          from PIL import Image, ImageOps

          # These are ACTUAL foreground MainActivity pixels from #149's
          # instrumentation/ADB capture, not a setContent fixture, generated
          # concept image, or claim of successful UI test gates.
          sources = [
              ("SOUNDHOST2", "artifacts/live-sound-host-normal", "orbital-emulator.png"),
              ("SOUNDCOMPACT2", "artifacts/live-sound-host-compact", "compact-350-sound.png"),
          ]
          for prefix, folder, name in sources:
              files = sorted(glob.glob(os.path.join(folder, '**', '*.png'), recursive=True))
              print(f'{prefix}_AVAILABLE_FILES:' + ','.join(os.path.basename(p) for p in files))
              exact = [p for p in files if os.path.basename(p) == name]
              assert exact, f'Expected exact real hosted {name}, not an arbitrary screenshot'
              path = exact[0]
              with open(path, 'rb') as handle:
                  blob = handle.read()
              assert blob.startswith(b'\x89PNG\r\n\x1a\n'), 'Invalid live-host PNG'
              image = Image.open(io.BytesIO(blob))
              original = image.size
              if prefix == "SOUNDHOST2":
                  assert original[0] >= 600 and original[1] >= 1000, 'Expected actual portrait phone'
              else:
                  assert original[0] >= 300 and original[1] >= 300, 'Expected authentic 350dp short-height emulator'
              preview = ImageOps.exif_transpose(image).convert('RGB')
              preview.thumbnail((700, 1556), Image.Resampling.LANCZOS)
              output = io.BytesIO()
              preview.save(output, format='JPEG', quality=53, optimize=True, progressive=True)
              jpeg = output.getvalue()
              assert 4000 < len(jpeg) < 190000, 'Suspicious hosted JPEG size'
              encoded = base64.b64encode(jpeg).decode('ascii')
              print(f'{prefix}_JPEG_BEGIN original={original} preview={preview.size} ' +
                    f'png_sha256={hashlib.sha256(blob).hexdigest()} jpeg_bytes={len(jpeg)}')
              for offset in range(0, len(encoded), 512):
                  print(f'{prefix}_B64_{offset//512:04d}:{encoded[offset:offset + 512]}')
              print(f'{prefix}_JPEG_END')
          PY
