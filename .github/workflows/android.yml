name: Android — build, JVM tests and emulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  # Keep main push/dispatch validations running; cancel only stale PR attempts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Kotlin tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate emulator harness syntax
        run: bash -n .github/workflows/ci-emulator.sh && bash -n .github/workflows/ci-compact350.sh && bash -n .github/workflows/ci-landscape.sh && bash -n .github/workflows/ci-compact-geometry.sh && bash -n .github/workflows/ci-immersive-stage.sh && bash -n .github/workflows/ci-oscillator-workbench.sh && bash -n .github/workflows/ci-live-stage-framebuffer.sh && bash -n .github/workflows/ci-stage-bootstrap.sh
      - name: Host tests, lint, app APK and instrumentation test APK
        run: gradle :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          # On a green job, a missing deliverable is a CI failure; on a failed
          # build/emulator run, retain best-effort artifact diagnostics.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 14
      - name: Upload instrumentation APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-debug-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          # On a green job, a missing deliverable is a CI failure; on a failed
          # build/emulator run, retain best-effort artifact diagnostics.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload host test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-host-test-reports
          path: |
            core/build/test-results/
            core/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  emulator:
    name: API 35 ${{ matrix.suite }} tests and emulator screenshots
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [general, compact, stage, visuals, compact350]
    env:
      ORBITAL_TEST_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # GENERAL and COMPACT350 keep Gradle's original connectedDebugAndroidTest task and its
      # complete JUnit/UTP XML. Run its expensive Kotlin/APK prerequisites
      # before booting QEMU, so test execution does not also compile source
      # while the emulator occupies several GiB of runner memory.
      - name: Precompile general and compact350 test binaries before QEMU
        if: ${{ matrix.suite == 'general' || matrix.suite == 'compact350' }}
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain --stacktrace
      # Both fresh screenshot lanes consume the EXACT APKs produced by the
      # already-required host/lint job; they must not compile under live QEMU.
      - name: Download validated app APK from host build
        if: ${{ matrix.suite == 'stage' || matrix.suite == 'visuals' }}
        uses: actions/download-artifact@v4
        with:
          name: orbital-debug-apk
          path: app/build/outputs/apk/debug
      - name: Download validated instrumented APK from host build
        if: ${{ matrix.suite == 'stage' || matrix.suite == 'visuals' }}
        uses: actions/download-artifact@v4
        with:
          name: orbital-debug-android-test-apk
          path: app/build/outputs/apk/androidTest/debug
      - name: Enable KVM for the emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch emulator, run instrumentation and capture actual UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: ${{ matrix.suite == 'compact' && '4000M' || '6000M' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          # The runner executes each nonempty script line in a separate `sh -c`.
          # Use one Bash command so traps, pipefail and exit codes work together.
          script: ${{ matrix.suite == 'compact' && 'bash .github/workflows/ci-compact-geometry.sh' || matrix.suite == 'stage' && 'bash .github/workflows/ci-stage-bootstrap.sh && bash .github/workflows/ci-live-stage-framebuffer.sh' || matrix.suite == 'visuals' && 'bash .github/workflows/ci-stage-bootstrap.sh && bash .github/workflows/ci-immersive-stage.sh && bash .github/workflows/ci-oscillator-workbench.sh && bash .github/workflows/ci-landscape.sh' || matrix.suite == 'compact350' && 'bash .github/workflows/ci-compact350.sh' || 'bash .github/workflows/ci-emulator.sh' }}
      - name: Upload real emulator screenshots
        if: ${{ always() && matrix.suite != 'compact350' }}
        uses: actions/upload-artifact@v4
        with:
          name: orbital-api35-${{ matrix.suite }}-emulator-screenshot
          path: |
            artifacts/orbital-emulator.png
            artifacts/orbital-compact-emulator.png
            artifacts/orbital-landscape-emulator.png
            artifacts/orbital-immersive-emulator.png
            artifacts/orbital-oscillator-workbench.png
            artifacts/orbital-focus-idle-black.png
            artifacts/orbital-focus-held-note.png
            artifacts/compact-350-sound.png
            artifacts/compact-350-fx.png
            artifacts/compact-350-sound-return.png
          # On a green job, a missing deliverable is a CI failure; on a failed
          # build/emulator run, retain best-effort artifact diagnostics.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 14
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-api35-${{ matrix.suite }}-emulator-diagnostics
          path: |
            artifacts/emulator-logcat.txt
            artifacts/compact-test-live-logcat.txt
            artifacts/compact350-*.txt
            artifacts/instrumentation-suite.txt
            artifacts/step-restart-*.txt
            artifacts/compact-e2e-phase.txt
            artifacts/compact-e2e-summary.txt
            artifacts/compact-350-logcat.txt
            artifacts/compact-350-launch.txt
            artifacts/compact-350-window.txt
            artifacts/compact-350-focus-*.txt
            artifacts/compact-350-launcher-*.txt
            artifacts/compact-350-*.xml
            artifacts/compact-350-*-dump.txt
            artifacts/activity-state.txt
            artifacts/activity-launch.txt
            artifacts/diagnostic-screen.png
            artifacts/window-state.txt
            artifacts/android-version.txt
            artifacts/emulator-exit-status.txt
            artifacts/emulator-summary.txt
            artifacts/emulator-phase.txt
            artifacts/emulator-provenance.txt
            artifacts/emulator-host-memory.txt
            artifacts/emulator-full-logcat.txt
            artifacts/emulator-apk-preflight.txt
            artifacts/compact-activity-launch.txt
            artifacts/compact-window-state.txt
            artifacts/audio-policy.txt
            artifacts/audio-flinger.txt
            artifacts/midi-state.txt
            artifacts/app-memory.txt
            artifacts/installed-package.txt
            artifacts/external-launcher-anr.txt
            artifacts/portrait-launcher-recovery-launch.txt
            artifacts/compact-launcher-recovery-launch.txt
            artifacts/display-state.txt
            artifacts/landscape-activity-launch.txt
            artifacts/landscape-window-state.txt
            artifacts/landscape-exit-status.txt
            artifacts/landscape-provenance.txt
            artifacts/landscape-logcat.txt
            artifacts/immersive-emulator-logcat.txt
            artifacts/immersive-emulator-phase.txt
            artifacts/immersive-emulator-summary.txt
            artifacts/oscillator-capture-phase.txt
            artifacts/oscillator-capture-summary.txt
            artifacts/oscillator-capture-logcat.txt
            artifacts/oscillator-activity-launch.txt
            artifacts/oscillator-window-state.txt
            artifacts/oscillator-test-apk-install.txt
            artifacts/oscillator-capture-instrumentation.txt
            artifacts/held-stage-*.txt
            artifacts/focus-bootstrap-*.txt
            artifacts/oscillator-*.xml
            artifacts/oscillator-*-dump.txt
            artifacts/immersive-gesture.txt
            artifacts/immersive-activity-launch.txt
            artifacts/immersive-window-state.txt
            artifacts/immersive-*-dump.txt
            artifacts/immersive-*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload instrumentation results
        if: ${{ always() && (matrix.suite == 'general' || matrix.suite == 'compact350') }}
        uses: actions/upload-artifact@v4
        with:
          name: orbital-${{ matrix.suite }}-android-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
