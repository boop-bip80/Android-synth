name: Android — build, JVM tests and emulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kotlin tests, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate emulator harness syntax
        run: bash -n .github/workflows/ci-emulator.sh
      - name: Host tests, lint, app APK and instrumentation test APK
        run: gradle :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload instrumentation APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-debug-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload host test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-host-test-reports
          path: |
            core/build/test-results/
            core/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  emulator:
    name: API 35 emulator, smoke test and screenshot
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM for the emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch emulator, run instrumentation and capture actual UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # The runner executes each nonempty script line in a separate `sh -c`.
          # Use one Bash command so traps, pipefail and exit codes work together.
          script: bash .github/workflows/ci-emulator.sh
      - name: Upload real emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-api35-emulator-screenshot
          path: |
            artifacts/orbital-emulator.png
            artifacts/orbital-compact-emulator.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-api35-emulator-diagnostics
          path: |
            artifacts/emulator-logcat.txt
            artifacts/activity-state.txt
            artifacts/activity-launch.txt
            artifacts/diagnostic-screen.png
            artifacts/window-state.txt
            artifacts/android-version.txt
            artifacts/emulator-exit-status.txt
            artifacts/emulator-summary.txt
            artifacts/emulator-phase.txt
            artifacts/emulator-provenance.txt
            artifacts/compact-activity-launch.txt
            artifacts/compact-window-state.txt
            artifacts/audio-policy.txt
            artifacts/audio-flinger.txt
            artifacts/midi-state.txt
            artifacts/app-memory.txt
            artifacts/display-state.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbital-android-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
