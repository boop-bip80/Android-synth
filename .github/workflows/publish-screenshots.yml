name: Publish verified Android emulator screenshots

# A CI artifact ZIP expires after 14 days. This workflow snapshots selected
# *actual* Android API35 framebuffers into the repository only after all nine
# Android CI jobs pass for the exact, still-current main commit.
on:
  workflow_run:
    workflows:
      - Android — build, JVM tests and emulator
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Persist genuine emulator PNGs from green main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Refuse stale or non-main CI provenance
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$local_sha" != "$SOURCE_SHA" || "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Stale successful CI: source=$SOURCE_SHA local=$local_sha remote=$remote_sha"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Verify all nine required source CI jobs
        if: steps.freshness.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .event == "push" and
            .head_branch == "main" and
            .head_repository.full_name == $repo and
            .head_sha == $sha and
            .path == ".github/workflows/android.yml"
          ' <<< "$run_json" >/dev/null || {
            echo "Screenshot provenance is not an exact successful first-party main source run." >&2
            exit 1
          }
          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100&filter=latest")"
          jq -e '
            .total_count == 9 and
            (.jobs | length) == 9 and
            all(.jobs[]; .status == "completed" and .conclusion == "success")
          ' <<< "$jobs_json" >/dev/null || {
            echo "Exactly nine successful Android host/API35 jobs are required for screenshots." >&2
            exit 1
          }
          for expected in \
            "Kotlin tests, lint and debug APK" \
            "API 35 general-0 tests and emulator screenshots" \
            "API 35 general-1 tests and emulator screenshots" \
            "API 35 compact tests and emulator screenshots" \
            "API 35 stage tests and emulator screenshots" \
            "API 35 visuals tests and emulator screenshots" \
            "API 35 compact350 tests and emulator screenshots" \
            "API 35 restart tests and emulator screenshots" \
            "Verify exact two-shard AndroidX test method union"; do
            jq -e --arg name "$expected" '
              any(.jobs[]; .name == $name and .conclusion == "success")
            ' <<< "$jobs_json" >/dev/null || {
              echo "Missing required green CI job: $expected" >&2
              exit 1
            }
          done
          echo "Verified all nine required green Android jobs on source $SOURCE_SHA"
      - name: Download successful compact screenshots
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/download-artifact@v4
        with:
          name: orbital-api35-compact-emulator-screenshot
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/orbital-capture/compact

      - name: Download successful stage screenshots
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/download-artifact@v4
        with:
          name: orbital-api35-stage-emulator-screenshot
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/orbital-capture/stage

      - name: Download successful visuals screenshots
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/download-artifact@v4
        with:
          name: orbital-api35-visuals-emulator-screenshot
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/orbital-capture/visuals

      - name: Validate every real PNG and record checksums
        if: steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import struct
          import zlib

          root = Path(os.environ["RUNNER_TEMP"]) / "orbital-capture"
          output = Path("docs/screenshots")
          output.mkdir(parents=True, exist_ok=True)
          wanted = (
              # The stage bootstrap requires an actually accessible normal
              # keybed and rejects the historical 19-20 KiB blank frame.
              ("stage", "orbital-emulator.png", "orbital-portrait.png", "Normal portrait (strict stage bootstrap)"),
              ("compact", "compact-350-sound.png", "orbital-compact.png", "360 x 350dp compact SOUND"),
              ("stage", "orbital-focus-held-note.png", "orbital-focus-held-note.png", "FOCUS live held-note"),
              ("visuals", "orbital-oscillator-workbench.png", "orbital-oscillator-workbench.png", "OSC1 editing"),
              ("visuals", "orbital-landscape-emulator.png", "orbital-landscape.png", "Landscape"),
          )
          rows = []
          for suite, source_name, target_name, label in wanted:
              source = root / suite / source_name
              data = source.read_bytes()  # No fallback or illustrative art.
              if not 4_096 <= len(data) <= 10_000_000:
                  raise SystemExit(f"{source}: implausible screenshot size")
              # This is the visibly interactive SOUND screen, never the
              # intentionally black FOCUS idle frame. Reject the known
              # blank-but-valid Android screencap regression independently
              # of the upstream UIAutomator semantic gate.
              if target_name == "orbital-portrait.png" and len(data) < 65_536:
                  raise SystemExit(f"{source}: blank-sized normal portrait")
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f"{source}: not an Android PNG")
              width, height = struct.unpack(">II", data[16:24])
              if width < 300 or height < 300:
                  raise SystemExit(f"{source}: invalid display geometry {width}x{height}")
              if target_name == "orbital-portrait.png" and (
                  width < 600 or height < 1000 or width >= height
              ):
                  raise SystemExit(f"{source}: not a full normal portrait framebuffer")
              # Parse every PNG chunk and validate CRC, rather than trusting a
              # filename or an upload-artifact success notice.
              pos = 8
              seen_end = False
              while pos < len(data):
                  if pos + 12 > len(data):
                      raise SystemExit(f"{source}: truncated PNG chunk")
                  chunk_length = struct.unpack(">I", data[pos:pos+4])[0]
                  end = pos + chunk_length + 12
                  if end > len(data):
                      raise SystemExit(f"{source}: chunk exceeds file")
                  kind = data[pos+4:pos+8]
                  expected_crc = struct.unpack(">I", data[end-4:end])[0]
                  if zlib.crc32(data[pos+4:end-4]) & 0xFFFFFFFF != expected_crc:
                      raise SystemExit(f"{source}: failed PNG CRC")
                  if kind == b"IEND":
                      seen_end = True
                      if pos + 12 != len(data):
                          raise SystemExit(f"{source}: data follows IEND")
                  pos = end
              if not seen_end:
                  raise SystemExit(f"{source}: no PNG IEND")
              target = output / target_name
              shutil.copyfile(source, target)
              digest = hashlib.sha256(data).hexdigest()
              artifact = f"orbital-api35-{suite}-emulator-screenshot"
              rows.append(f"| {label} | `{artifact}` | [{target_name}]({target_name}) | {width} x {height} | `{digest}` |")
              print(f"{label}: {width}x{height}, {len(data)} bytes, sha256={digest}")

          # Optional gallery frames (real Android framebuffers with live motion). The capture is
          # deliberately non-blocking, so each is published only if it genuinely exists and
          # passes the same PNG integrity checks; a missing one never fails the publication.
          optional = (
              ("visuals", "orbital-aurora-play.png", "orbital-aurora-play.png", "AURORA stage: held chord, live motion"),
              ("visuals", "orbital-aurora-lesson.png", "orbital-aurora-lesson.png", "AURORA stage: follow-the-light lesson"),
          )
          for suite, source_name, target_name, label in optional:
              source = root / suite / source_name
              if not source.is_file():
                  print(f"{label}: not captured in the verified run; skipping")
                  continue
              data = source.read_bytes()
              try:
                  if not 20_000 <= len(data) <= 10_000_000:
                      raise ValueError("implausible size")
                  if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                      raise ValueError("not a PNG")
                  width, height = struct.unpack(">II", data[16:24])
                  if width < 600 or height < 1000 or width >= height:
                      raise ValueError(f"not a portrait frame {width}x{height}")
                  pos = 8
                  seen_end = False
                  while pos < len(data):
                      if pos + 12 > len(data):
                          raise ValueError("truncated chunk")
                      chunk_length = struct.unpack(">I", data[pos:pos+4])[0]
                      end = pos + chunk_length + 12
                      if end > len(data):
                          raise ValueError("chunk exceeds file")
                      expected_crc = struct.unpack(">I", data[end-4:end])[0]
                      if zlib.crc32(data[pos+4:end-4]) & 0xFFFFFFFF != expected_crc:
                          raise ValueError("bad CRC")
                      if data[pos+4:pos+8] == b"IEND":
                          seen_end = True
                      pos = end
                  if not seen_end:
                      raise ValueError("no IEND")
              except ValueError as problem:
                  print(f"{label}: rejected ({problem}); skipping")
                  continue
              shutil.copyfile(source, output / target_name)
              digest = hashlib.sha256(data).hexdigest()
              artifact = f"orbital-api35-{suite}-emulator-screenshot"
              rows.append(f"| {label} | `{artifact}` | [{target_name}]({target_name}) | {width} x {height} | `{digest}` |")
              print(f"{label}: {width}x{height}, {len(data)} bytes, sha256={digest}")

          sha = os.environ["SOURCE_SHA"]
          run_id = os.environ["SOURCE_RUN_ID"]
          run_number = os.environ["SOURCE_RUN_NUMBER"]
          provenance = [
              "# Real ORBITAL emulator framebuffers",
              "",
              "These images are genuine screenshots captured by Android API 35 x86_64",
              "from the debug APK in the same nine-job fully successful GitHub Actions run.",
              "They are not the generated concept reference or a claim of physical-device testing.",
              "",
              f"- Verified source commit: [`{sha}`](https://github.com/boop-bip80/Android-synth/commit/{sha})",
              f"- Successful CI: [run #{run_number}](https://github.com/boop-bip80/Android-synth/actions/runs/{run_id})",
              "- Source artifact names: orbital-api35-compact-emulator-screenshot,",
              "  orbital-api35-stage-emulator-screenshot,",
              "  orbital-api35-visuals-emulator-screenshot.",
              "- The portrait is from the stage lane's strict real-keyboard normal",
              "  bootstrap, not the looser general screenshot artifact.",
              "",
              "| Actual app state | Verified source artifact | File | Pixels | SHA-256 |",
              "| --- | --- | --- | ---: | --- |",
              *rows,
              "",
              "The concept design remains at [design/orbital-ui-reference.png](../../design/orbital-ui-reference.png).",
              "Physical Android audio latency, thermals, MIDI and accessibility remain separate device-level gates.",
              "",
          ]
          (output / "PROVENANCE.md").write_text("\n".join(provenance), encoding="utf-8")
          PY

      - name: Publish only if main still equals fully tested source
        if: steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "Main advanced during screenshot verification; refusing stale publication."
            exit 0
          fi
          git add docs/screenshots/
          if git diff --cached --quiet; then
            echo "Exact verified screenshots already published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(screenshots): persist genuine API35 images for $SOURCE_SHA"
          # Normal fast-forward push only; a concurrent main update rejects
          # this commit. GITHUB_TOKEN pushes do not recursively trigger CI.
          git push origin HEAD:refs/heads/main
